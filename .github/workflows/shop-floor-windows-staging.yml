name: Build Windows Shop Floor staging
on:
  push:
    branches: [change-in-billing-units]
    paths: ['desktop/**', '.github/workflows/shop-floor-windows-staging.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build staging Windows app
        run: dotnet publish desktop/BridgesShopFloor/BridgesShopFloor.csproj -c Release -r win-x64 --self-contained true -o desktop-output -p:DefineConstants=SHOP_FLOOR_STAGING
      - uses: actions/upload-artifact@v4
        with:
          name: Bridges-Shop-Floor-Windows-Staging-x64
          path: desktop-output/
          retention-days: 14
          if-no-files-found: error
