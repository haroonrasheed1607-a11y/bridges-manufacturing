name: Build Windows Shop Floor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/shop-floor-windows.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test updater with actual Windows file locks
        run: ./desktop/Test-Updater.ps1
      - name: Build self-contained Windows app
        run: dotnet publish desktop/BridgesShopFloor/BridgesShopFloor.csproj -c Release -r win-x64 --self-contained true -o desktop-output -p:PublishSingleFile=false
      - name: Include instructions
        run: Copy-Item desktop/README.md desktop-output/START-HERE.md
      - uses: actions/upload-artifact@v4
        with:
          name: Bridges-Shop-Floor-Windows-x64
          path: desktop-output/
          retention-days: 30
      - name: Publish public Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path desktop-output/* -DestinationPath Bridges-Shop-Floor-Windows-x64.zip
          gh release view shop-floor-v1 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create shop-floor-v1 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Bridges Shop Floor for Windows" --notes "Windows x64 portable app for Brother QL-800. Extract all files and run BridgesShopFloor.exe. Requires Brother driver and WebView2 Runtime. Physical printer validation is required."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload shop-floor-v1 Bridges-Shop-Floor-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$project = Get-Content desktop/BridgesShopFloor/BridgesShopFloor.csproj
          @{version=[string]$project.Project.PropertyGroup.Version;sha256=(Get-FileHash Bridges-Shop-Floor-Windows-x64.zip -Algorithm SHA256).Hash} | ConvertTo-Json | Set-Content shop-floor-update.json
          gh release upload shop-floor-v1 shop-floor-update.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
